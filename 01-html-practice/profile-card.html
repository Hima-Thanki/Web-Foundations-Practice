
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile Card</title>
    <link rel="stylesheet" href="profile-card.css">
</head>
<body>

    <main class="profile-card">
        <div class="profile-avatar">HT</div>

        <h1>Hima Thanki</h1>
        <h2>Web Developer & Graphic Designer</h2>

        <p class="profile-description">

            hands-on projects.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>

        <a
            class="github-button"
            href="https://github.com/Hima-Thanki"
            target="_blank"
            rel="noopener noreferrer"
        >
            Visit My GitHub
        </a>
    </main>

</body>
</html>
